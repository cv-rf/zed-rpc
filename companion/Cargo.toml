[package]
name = "discord-rpc-companion"
version = "0.1.0"
edition = "2021"
authors = ["Zed RPC Team <dev@zed-rpc.local>"]
description = "Native LSP companion server for Zed Discord Rich Presence"

[dependencies]
tokio = { version = "1.40", features = ["rt-multi-thread", "io-util", "io-std", "macros", "time", "sync", "process", "net", "signal"] }
tower-lsp = "0.20.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"
uuid = { version = "1.10", features = ["v4"] }
