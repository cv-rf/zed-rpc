name: Release Companion Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: discord-rpc-companion-x86_64-unknown-linux-gnu.tar.gz
            binary: discord-rpc-companion
            archive_cmd: tar -czf
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: discord-rpc-companion-aarch64-apple-darwin.tar.gz
            binary: discord-rpc-companion
            archive_cmd: tar -czf
          - os: macos-13
            target: x86_64-apple-darwin
            artifact_name: discord-rpc-companion-x86_64-apple-darwin.tar.gz
            binary: discord-rpc-companion
            archive_cmd: tar -czf
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: discord-rpc-companion-x86_64-pc-windows-msvc.zip
            binary: discord-rpc-companion.exe
            archive_cmd: 7z a

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build companion
        run: |
          cargo build --release --target ${{ matrix.target }} -p discord-rpc-companion

      - name: Package binary (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czf ../../../${{ matrix.artifact_name }} ${{ matrix.binary }}
          cd ../../..

      - name: Package binary (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../${{ matrix.artifact_name }} ${{ matrix.binary }}
          cd ../../..

      - name: Upload artifact to release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.artifact_name }}
          draft: false
          prerelease: false
